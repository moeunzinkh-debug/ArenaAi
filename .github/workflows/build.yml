name: Build debug APK

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships the Android SDK; just make sure the
      # API-35 packages we compile against are present.
      - name: Ensure Android platform 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The raw job log lives on a blob host that some networks cannot reach, so
      # the compile errors are echoed as annotations, which stay readable via
      # `gh run view` and on the run's page.
      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -aE "error: |^e: |Execution failed for task|What went wrong|Caused by:|AAPT" -A 2 "$RUNNER_TEMP/build.log" \
            | head -100 | while IFS= read -r line; do
              echo "::error title=Gradle::$line"
            done || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ArenaAssist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
